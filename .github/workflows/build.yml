name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk GlyphScanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GlyphScanner
          path: GlyphScanner.apk

      - name: Publish as release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GlyphScanner.apk \
            --title "Glyph Scanner (Build ${{ github.run_number }})" \
            --notes "Automatischer Build von ${GITHUB_SHA::7}. APK am Handy herunterladen und installieren."
